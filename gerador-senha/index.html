<!DOCTYPE html>
<html lang="pt-ao">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador De Senha</title>
    <link href="fonts/fontawesome-6.5.2/css/fontawesome.css" rel="stylesheet">
    <link href="fonts/fontawesome-6.5.2/css/brands.css" rel="stylesheet">
    <link href="fonts/fontawesome-6.5.2/css/solid.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section>
        <h1>Gerador De Senha</h1>

        <form action="" method="POST" id="form">
            <div class="inputBox">
                <input type="text" class="input" id="senha" placeholder="Seu senha vai estar aqui" readonly>
                <i class="fas fa-copy"></i>
            </div>

            <button type="submit" class="btn">Gerar</button>
        </form>
    </section>
    <script type="text/javascript" src="js/script.js"></script>
</body>
</html>
