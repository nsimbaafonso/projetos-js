<!DOCTYPE html>
<html lang="pt-ao">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Imagens</title>
    <link href="fonts/fontawesome-6.5.2/css/fontawesome.css" rel="stylesheet">
    <link href="fonts/fontawesome-6.5.2/css/brands.css" rel="stylesheet">
    <link href="fonts/fontawesome-6.5.2/css/solid.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section>
        <h1>Buscador de Imagens</h1>
        <form action="" class="search-form" id="search-form">
            <input type="search" name="busca" id="search-box" placeholder="Busque aqui..." required>
            <button type="submit" class="fas fa-search" title="Pesquisar"></button>
        </form>

        <div class="box-container" id="search-result">
            <div class="box">
                <img src="img/book.jpg" alt="Imagem">
            </div>
            <div class="box">
                <img src="img/book.jpg" alt="Imagem">
            </div>
            <div class="box">
                <img src="img/book.jpg" alt="Imagem">
            </div>
        </div>

        <div class="d-flex">
            <button class="btn" id="mostrar-mais">Mostrar Mais</button>
        </div>
    </section>
    <script type="text/javascript" src="js/script.js"></script>
</body>
</html>
